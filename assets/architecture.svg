<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="hitlCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311317" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e1014" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="graphCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1f38" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="ingestCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f2c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#081d1e" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10b981" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#ef4444" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-size="26" font-weight="800" fill="url(#headerGrad)" letter-spacing="1">MEDIFLOW AI — SYSTEM ARCHITECTURE</text>
    <text x="0" y="24" font-size="13" font-weight="500" fill="#94a3b8">Multi-Tenant Clinical Intelligence Platform • LangGraph Triage • Human-in-the-Loop Oversight • Non-Blocking Async Ingestion</text>
  </g>

  <!-- COLUMN 1: CLIENT TIER (Left) -->
  <g transform="translate(50, 100)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="240" height="630" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <rect width="240" height="38" rx="14" fill="#1e293b" />
    <path d="M0 24 h240 v14 h-240 z" fill="#1e293b" />
    <text x="20" y="24" font-size="13" font-weight="700" fill="#38bdf8">CLIENT PRESENTATION TIER</text>

    <!-- Patient Portal Card -->
    <g transform="translate(15, 55)">
      <rect width="210" height="120" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="14" y="26" font-size="13" font-weight="700" fill="#e2e8f0">Patient Portal</text>
      <text x="14" y="44" font-size="11" fill="#94a3b8">Next.js 16 • Turbopack • Tailwind</text>
      <path d="M 14 56 h 182" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="74" font-size="11" fill="#cbd5e1">• Symptom Triage Chat</text>
      <text x="14" y="92" font-size="11" fill="#cbd5e1">• EHR Report Upload Portal</text>
      <text x="14" y="110" font-size="11" fill="#cbd5e1">• Multi-Slot Scheduling</text>
    </g>

    <!-- Clinician Oversight Dashboard -->
    <g transform="translate(15, 195)">
      <rect width="210" height="150" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <text x="14" y="26" font-size="13" font-weight="700" fill="#f472b6">Clinician HITL Dashboard</text>
      <text x="14" y="44" font-size="11" fill="#94a3b8">Real-Time Clinical Supervision</text>
      <path d="M 14 56 h 182" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="74" font-size="11" fill="#cbd5e1">• Pending Review Queue</text>
      <text x="14" y="92" font-size="11" fill="#cbd5e1">• 1-Click Approve / Modify</text>
      <text x="14" y="110" font-size="11" fill="#cbd5e1">• Red-Line Safety Alerts</text>
      <text x="14" y="128" font-size="11" fill="#cbd5e1">• Circuit Breaker Telemetry</text>
    </g>

    <!-- Multi-Tenant Auth Guard -->
    <g transform="translate(15, 365)">
      <rect width="210" height="120" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <text x="14" y="26" font-size="13" font-weight="700" fill="#c084fc">Auth &amp; Tenant Guard</text>
      <text x="14" y="44" font-size="11" fill="#94a3b8">Zero-Config Demo + Firebase</text>
      <path d="M 14 56 h 182" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="74" font-size="11" fill="#cbd5e1">• Strict tenant_id Isolation</text>
      <text x="14" y="92" font-size="11" fill="#cbd5e1">• Role Partitioning (MD/Patient)</text>
      <text x="14" y="110" font-size="11" fill="#cbd5e1">• Bearer Token Context</text>
    </g>

    <!-- Admin Operations Hub -->
    <g transform="translate(15, 505)">
      <rect width="210" height="105" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="14" y="24" font-size="12" font-weight="700" fill="#34d399">Operations &amp; Metrics</text>
      <text x="14" y="42" font-size="10" fill="#94a3b8">Hospital Operations Telemetry</text>
      <path d="M 14 52 h 182" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="70" font-size="10" fill="#cbd5e1">• Daily Triage Volume</text>
      <text x="14" y="86" font-size="10" fill="#cbd5e1">• High-Risk Alert Statistics</text>
    </g>
  </g>

  <!-- COLUMN 2: LANGGRAPH CLINICAL TRIAGE & HITL (Middle) -->
  <g transform="translate(320, 100)" filter="url(#shadow)">
    <rect width="520" height="630" rx="14" fill="url(#graphCard)" stroke="#1e3a8a" stroke-width="1.5" />
    <rect width="520" height="38" rx="14" fill="#172554" />
    <path d="M0 24 h520 v14 h-520 z" fill="#172554" />
    <text x="20" y="24" font-size="13" font-weight="700" fill="#60a5fa">LANGGRAPH CLINICAL TRIAGE &amp; DETERMINISTIC MULTI-AGENT STATEGRAPH</text>

    <!-- Stage 1: Ingestion & Classification -->
    <g transform="translate(30, 55)">
      <!-- Classifier -->
      <rect x="0" y="0" width="215" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="12" y="24" font-size="12" font-weight="700" fill="#38bdf8">1. Query Classifier Agent</text>
      <text x="12" y="44" font-size="10" fill="#94a3b8">Intent Extraction • Context Mapping</text>

      <!-- Risk Evaluator -->
      <rect x="245" y="0" width="215" height="65" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="12" y="24" transform="translate(245, 0)" font-size="12" font-weight="700" fill="#fbbf24">2. Risk Evaluator Agent</text>
      <text x="12" y="44" transform="translate(245, 0)" font-size="10" fill="#94a3b8">Clinical Red-Flag &amp; Emergency Rules</text>

      <!-- Arrow -->
      <line x1="215" y1="32" x2="240" y2="32" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)" />
    </g>

    <!-- Connector down to HITL Gate -->
    <line x1="465" y1="120" x2="465" y2="145" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="465" y1="145" x2="260" y2="145" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowCyan)" />

    <!-- Stage 2: HITL Safety Gate -->
    <g transform="translate(30, 160)">
      <rect width="460" height="75" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
      <text x="20" y="28" font-size="13" font-weight="800" fill="#38bdf8">3. HITL Clinical Safety Gate Node</text>
      <text x="20" y="48" font-size="11" fill="#94a3b8">Evaluates risk_level == HIGH or intent == emergency_symptom</text>
      <text x="20" y="64" font-size="10" fill="#64748b">Conditional Routing: High-Risk (Suspend) vs Low/Medium (Proceed)</text>
    </g>

    <!-- SPLIT: Emergency Suspend Branch (Left) vs Routine Subgraphs (Right) -->
    <!-- Emergency Branch -->
    <g transform="translate(30, 260)">
      <line x1="100" y1="-25" x2="100" y2="0" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" />
      <rect width="210" height="195" rx="10" fill="url(#hitlCard)" stroke="#dc2626" stroke-width="1.5" />
      <text x="14" y="26" font-size="12" font-weight="800" fill="#f87171">SUSPEND LIVE EXECUTION</text>
      <text x="14" y="44" font-size="10" fill="#fca5a5">Risk: HIGH • Autonomous AI Halt</text>
      <path d="M 14 54 h 182" stroke="#7f1d1d" stroke-width="1" />
      <text x="14" y="74" font-size="10" fill="#fecaca">• Enqueue: hitl_reviews DB</text>
      <text x="14" y="94" font-size="10" fill="#fecaca">• Status: pending_review</text>
      <text x="14" y="114" font-size="10" fill="#fecaca">• Alert On-Call Clinician</text>
      <text x="14" y="134" font-size="10" fill="#fecaca">• Resume on MD Sign-Off</text>
      <rect x="14" y="150" width="182" height="32" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="1" />
      <text x="24" y="170" font-size="10" font-weight="700" fill="#fca5a5">Action: Modify &amp; Sign / Approve</text>
    </g>

    <!-- Routine Branch -->
    <g transform="translate(260, 260)">
      <line x1="130" y1="-25" x2="130" y2="0" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)" />
      <rect width="230" height="195" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
      <text x="14" y="24" font-size="12" font-weight="700" fill="#34d399">DATA GATHERING SUBGRAPH</text>
      <text x="14" y="40" font-size="10" fill="#94a3b8">Risk: LOW / MEDIUM (Proceed)</text>
      <path d="M 14 48 h 202" stroke="#1e293b" stroke-width="1" />

      <!-- Node 4a -->
      <rect x="14" y="58" width="202" height="42" rx="6" fill="#1e293b" stroke="#0d9488" stroke-width="1" />
      <text x="24" y="76" font-size="11" font-weight="600" fill="#2dd4bf">4. RAG Retrieval Agent</text>
      <text x="24" y="90" font-size="9" fill="#94a3b8">Pinecone Vector DB • Clinical Guidelines</text>

      <!-- Node 4b -->
      <rect x="14" y="112" width="202" height="42" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
      <text x="24" y="130" font-size="11" font-weight="600" fill="#38bdf8">5. Appointment Router</text>
      <text x="24" y="144" font-size="9" fill="#94a3b8">Doctor Schedules • Slot Reservation</text>

      <rect x="14" y="164" width="202" height="20" rx="4" fill="#064e3b" />
      <text x="35" y="178" font-size="9" font-weight="700" fill="#6ee7b7">State Handoff: data_gathering -> writer</text>
    </g>

    <!-- Response Generation & Validation Subgraph -->
    <g transform="translate(30, 475)">
      <rect width="460" height="135" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="20" y="24" font-size="12" font-weight="700" fill="#c084fc">RESPONSE GENERATION &amp; SAFETY VALIDATION SUBGRAPH</text>

      <!-- Response Writer -->
      <rect x="15" y="40" width="200" height="75" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="26" y="62" font-size="11" font-weight="700" fill="#d8b4fe">6. Response Writer Agent</text>
      <text x="26" y="80" font-size="9" fill="#cbd5e1">Gemini 1.5 Flash / Demo Engine</text>
      <text x="26" y="96" font-size="9" fill="#94a3b8">Evidence-Grounded Synthesis</text>

      <!-- Arrow -->
      <line x1="215" y1="78" x2="238" y2="78" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowPurple)" />

      <!-- Validator & Circuit Breaker -->
      <rect x="245" y="40" width="200" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="256" y="62" font-size="11" font-weight="700" fill="#34d399">7. Validator Agent</text>
      <text x="256" y="80" font-size="9" fill="#cbd5e1">Contraindication Screening</text>
      <text x="256" y="96" font-size="9" fill="#94a3b8">Circuit Breaker Guard • Disclaimers</text>
    </g>
  </g>

  <!-- COLUMN 3: INGESTION PIPELINE & PERSISTENCE (Right) -->
  <g transform="translate(860, 100)" filter="url(#shadow)">
    <rect width="290" height="630" rx="14" fill="url(#ingestCard)" stroke="#065f46" stroke-width="1.5" />
    <rect width="290" height="38" rx="14" fill="#064e3b" />
    <path d="M0 24 h290 v14 h-290 z" fill="#064e3b" />
    <text x="20" y="24" font-size="13" font-weight="700" fill="#34d399">ASYNC INGESTION &amp; STORAGE</text>

    <!-- Async Document Ingestion Engine -->
    <g transform="translate(15, 55)">
      <rect width="260" height="175" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
      <text x="14" y="24" font-size="12" font-weight="700" fill="#34d399">Non-Blocking Ingestion Pipeline</text>
      <text x="14" y="40" font-size="10" fill="#94a3b8">High-Throughput Clinical Parsing</text>
      <path d="M 14 48 h 232" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="68" font-size="10" fill="#cbd5e1">• CPU Offload: asyncio.to_thread</text>
      <text x="14" y="86" font-size="10" fill="#cbd5e1">• Semaphore Concurrency Control</text>
      <text x="14" y="104" font-size="10" fill="#cbd5e1">• Pydantic v2 Schema Enforcement</text>
      <text x="14" y="122" font-size="10" fill="#94a3b8">  - Vital Signs (BP, HR, SpO2, RR)</text>
      <text x="14" y="138" font-size="10" fill="#94a3b8">  - Active Medications (Route, Freq)</text>
      <text x="14" y="154" font-size="10" fill="#94a3b8">  - Lab Indices &amp; ICD-10 Coding</text>
    </g>

    <!-- Runtime Circuit Breaker Box -->
    <g transform="translate(15, 245)">
      <rect width="260" height="135" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
      <text x="14" y="24" font-size="12" font-weight="700" fill="#fbbf24">Clinical Circuit Breakers</text>
      <text x="14" y="40" font-size="10" fill="#94a3b8">3-State Safety State Machine</text>
      <path d="M 14 48 h 232" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="68" font-size="10" fill="#fde68a">• CLOSED: Normal Operations</text>
      <text x="14" y="86" font-size="10" fill="#fca5a5">• OPEN: Tripped (Fail-Safe Fast)</text>
      <text x="14" y="104" font-size="10" fill="#fed7aa">• HALF_OPEN: Probe Recovery</text>
      <text x="14" y="122" font-size="10" fill="#cbd5e1">• Deterministic ER Fallback</text>
    </g>

    <!-- Multi-Tenant Database & RLS -->
    <g transform="translate(15, 395)">
      <rect width="260" height="215" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
      <text x="14" y="24" font-size="12" font-weight="700" fill="#38bdf8">PostgreSQL (RLS) &amp; Storage</text>
      <text x="14" y="40" font-size="10" fill="#94a3b8">Supabase Cloud / Local Partition</text>
      <path d="M 14 48 h 232" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="68" font-size="10" fill="#bae6fd">• appointments (tenant_id indexed)</text>
      <text x="14" y="86" font-size="10" fill="#bae6fd">• hitl_reviews (status, risk, signoff)</text>
      <text x="14" y="104" font-size="10" fill="#bae6fd">• medical_reports (structured JSONB)</text>
      <text x="14" y="122" font-size="10" fill="#bae6fd">• escalations (real-time alerts)</text>
      <text x="14" y="140" font-size="10" fill="#94a3b8">• Row-Level Security (RLS) Policy:</text>
      <rect x="14" y="152" width="232" height="48" rx="6" fill="#0c192c" stroke="#1e3a8a" stroke-width="1" />
      <text x="22" y="170" font-size="9" font-family="Consolas, monospace" fill="#7dd3fc">CREATE POLICY tenant_isolation</text>
      <text x="22" y="186" font-size="9" font-family="Consolas, monospace" fill="#7dd3fc">USING (tenant_id = current_tenant);</text>
    </g>
  </g>

  <!-- Connectors between Tiers -->
  <line x1="290" y1="160" x2="320" y2="160" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="290" y1="270" x2="320" y2="270" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="840" y1="160" x2="860" y2="160" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="840" y1="500" x2="860" y2="500" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Footer Tagline -->
  <g transform="translate(60, 755)">
    <text x="0" y="0" font-size="11" font-weight="500" fill="#64748b">MediFlow AI Platform v2.0 • Architect: Prannessh KVA • Zero-Config Local Demonstration &amp; Production Cloud Ready</text>
  </g>
</svg>
